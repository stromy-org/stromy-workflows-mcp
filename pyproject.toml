[project]
name = "stromy-workflows-mcp"
version = "0.2.0"
description = "Hosted workflow discovery, validation, execution, and lifecycle facade for Stromy"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "William Masquelier", email = "william.masquelier@stromy.com.au" }]
# INDIVIDUALITY (ORG-PLAN-086 §2) — this list is PROJECT-OWNED. The template
# renders only the minimal stable base set below and never edits these lines
# again, so `copier update`'s 3-way merge replays your added deps cleanly. Add
# deps with `uv add`; fleet-wide base deps arrive via a `_migrations` `uv add`,
# never by the template rewriting this list.
dependencies = [
    "azure-identity>=1.19,<2",
    # Queue dispatch + browser-upload SAS minting (ORG-PLAN-164). Both
    # authenticate as the facade's managed identity via azure-identity above —
    # a user-delegation SAS is signed with an Entra key, never the account key.
    "azure-storage-blob>=12.23,<13",
    "azure-storage-queue>=12.11,<13",
    # Floor is >=3.4.4, NOT >=3.0.0: fastmcp 3.4.3 shipped a Host/Origin guard for
    # DNS-rebinding protection (PrefectHQ/fastmcp#4405) whose defaults 403 the
    # cross-origin dynamic client registration a hosted MCP client performs behind
    # a reverse proxy (ACA ingress); 3.4.4 exists to undo exactly that (#4439).
    # A server that resolves onto 3.4.3 cannot complete OAuth at all — it 403s
    # POST /register and POST /consent before the account picker appears, which
    # reads as an auth bug but is a transport one. Keep the floor above it.
    "fastmcp>=3.4.4",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "psycopg[binary]>=3.3.4,<4",
    # The shared run-registry lifecycle (ORG-PLAN-155). BASE install only —
    # no `executor`/`rabbitmq` extras, so the facade acquires neither
    # LangGraph nor aio-pika. The dependency-audit step asserts that.
    "workflow-runtime-core",
    "pydantic-settings>=2.0.0",
    # Fresh short-lived download URLs for published run artifacts. The account is
    # passed explicitly from WORKFLOW_STORAGE_ACCOUNT (>=0.6.0), so the facade
    # never has to export this library's own ASSET_STORE_* env names.
    "stromy-asset-transport>=0.6.0",
    # The shared BYOK credential plane (ORG-PLAN-206 C4). `[azure]` extra: the
    # facade holds Key Vault Secrets OFFICER on kv-stromy-wf-byok, so it is the
    # registration writer. The runner reads with Secrets User through its own
    # install — the reader/writer protocol split mirrors that RBAC split.
    "stromy-byok[azure]>=0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stromy_workflows_mcp"]

# PEP 735 dependency-groups — installed by default with `uv sync` (no --extra
# needed). ruff + pyright MUST live here: the org reusable ci-python.yml runs
# `uv run ruff check` / `uv run pyright`, which fail to spawn if the tools are
# not installed (a scaffold whose dev group omits them ships a red CI on day one).
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.2",
    "pyright>=1.1",
    # The upload-session sweep DELETES rows, and its predicate is what stands
    # between a lapsed session and a run's provenance. A faked cursor would assert
    # only that we call our own code, so that one suite runs against a real engine
    # (ORG-PLAN-164 WS5). It SKIPS where neither STROMY_TEST_PG_DSN nor a Docker
    # daemon is available, which is why CI is unaffected until a postgres service
    # is wired into ci.yml.
    "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--import-mode=importlib"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Org standard (AGENTS.md): E,F,I,UP + ASYNC,B,PERF,S. Chrome region — the
# 3-way merge updates it on `copier update`.
select = ["E", "F", "I", "UP", "ASYNC", "B", "PERF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # `assert` is the pytest idiom

[tool.uv.sources]
# Public repo: this repo is public too, and a public caller cannot read a
# private one — an exact PUBLIC tag is what removes the build-credential
# problem entirely (ORG-PLAN-155 locked decision 3).
workflow-runtime-core = { git = "https://github.com/stromy-org/workflow-runtime-core.git", tag = "v0.4.0" }
# Result retrieval mints a read URL per authorized call; the account and container
# are passed EXPLICITLY (>=0.6.0), because this library's own ASSET_STORE_ACCOUNT
# names the brand-asset account rather than the workflow one.
stromy-asset-transport = { git = "https://github.com/stromy-org/asset-transport.git", tag = "v0.6.0" }
# Published public (2026-08-16) for exactly the reason above: this consumer is
# public, and a public caller cannot read a private repo. The library is
# client-neutral by construction — it hardcodes no client, vault URI, provider
# endpoint or service name — so the pinned-PUBLIC-tag pattern applies unchanged.
stromy-byok = { git = "https://github.com/stromy-org/stromy-byok.git", tag = "v0.2.1" }
