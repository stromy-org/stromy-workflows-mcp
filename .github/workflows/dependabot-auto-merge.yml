name: dependabot-auto-merge

# Auto-merges low-risk Dependabot PRs once required CI checks pass:
#   * any patch bump, and
#   * minor bumps that are NOT a direct production dependency (dev tooling and
#     transitive pins) — those cannot change this package's runtime behaviour.
# Minor bumps of direct production deps, and every major, stay for human review.
# Security-grouped PRs of any severity also wait for review (Dependabot marks them).
#
# REQUIRES `allow_auto_merge: true` ON THE REPO. That setting defaults to FALSE on
# every newly created GitHub repo, and `gh pr merge --auto` is a SILENT no-op without
# it — the job still reports success, so the breakage is invisible. On 2026-07-27 it
# was off on 7 of the 8 plugins shipping this workflow, which is why 89 Dependabot PRs
# had accumulated org-wide. `scripts/audit-repo-branch-hygiene.py` now checks it.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for low-risk updates
        if: >-
          ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' ||
              (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
               steps.meta.outputs.dependency-type != 'direct:production') }}
        run: |
          # `gh pr merge --auto` needs TWO preconditions, not the one documented
          # above:
          #   1. `allow_auto_merge: true` on the repo, AND
          #   2. a branch-protection rule on the target branch.
          # Without (2) GitHub rejects the call outright with
          #   "Pull request Branch does not have required protected branch rules".
          # Failing the job there is worse than useless: the red `auto-merge`
          # check turns the PR's whole rollup RED, which makes the org's FALLBACK
          # merger (arbiter class P, stromy-org/scripts/merge-ready-prs.py)
          # classify the PR as CI_RED and refuse it. The broken automation thereby
          # blocks the backup automation and the PR parks forever -- which is how
          # 57 PRs accumulated org-wide by 2026-07-30, 55 of them dependabot.
          # So degrade to a warning and leave the PR GREEN and merge-able by the
          # fallback. A genuine error still fails the job.
          if ! out=$(gh pr merge --auto --squash "$PR_URL" 2>&1); then
            printf '%s\n' "$out"
            case "$out" in
              *enablePullRequestAutoMerge*|*"protected branch rules"*)
                echo "::warning::auto-merge unavailable here (no branch-protection rule on the target branch); leaving the PR green for the fallback merger"
                exit 0 ;;
              *) exit 1 ;;
            esac
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
