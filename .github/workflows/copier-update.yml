name: Copier update

# Tier-1 of the MCP fleet-maintenance pipeline (ORG-PLAN-086). Runs
# `copier update` against the template HEAD on a schedule, opens a PR with the
# chrome-only diff, and NEVER auto-merges — a human reviews + merges. On a merge
# conflict (`.rej` files present) it files/updates a single tracking issue
# instead of a broken PR. This workflow itself is CHROME, so it flows down to
# every satellite via the very updates it opens.

on:
  schedule:
    # Weekly, Tuesday 05:30 UTC (staggered from the org routine fleet).
    - cron: "30 5 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: copier-update
  cancel-in-progress: false

jobs:
  copier-update:
    runs-on: ubuntu-latest
    # `secrets` is NOT a valid context in a step-level `if:` — surface CI_APP_ID
    # through a job-level env so the App-token step can gate on its presence
    # (`env` IS valid in `if:`). Without this the workflow fails to compile.
    env:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
    steps:
      # The org stromy-ci App token: clones the (possibly private) template and
      # authors the PR/issue. No-op-safe if the App secrets are absent — the
      # step falls back to GITHUB_TOKEN (which can still open a same-repo PR).
      - name: Generate stromy-ci App token
        id: app-token
        if: ${{ env.CI_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: stromy-org

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0

      - name: Ensure scheduled-routine label exists
        env:
          # In-repo issue/label writes use the workflow's own token — the
          # permissions block grants it; the stromy-ci App deliberately lacks
          # Issues permission (verified 2026-08-07: createIssue 403'd).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent: creates the label if a satellite has never had one
          # opened, updates it (no-op) if it already exists. Without this,
          # `gh issue create --label` below fails hard on a fresh satellite,
          # and the PR-creation action's own label step silently drops the
          # label rather than failing — either way the routine is invisible
          # to the org's `scheduled-routine` discovery convention.
          gh label create scheduled-routine \
            --color ededed \
            --description "Opened by an unattended scheduled routine (never auto-merged)" \
            --force

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run copier update
        id: update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -uo pipefail
          git config user.name "stromy-ci[bot]"
          git config user.email "stromy-ci[bot]@users.noreply.github.com"

          # copier's own clone of the (possibly private) template is a plain
          # `git clone` over HTTPS — it never sees $GH_TOKEN (that only
          # authenticates the `gh` CLI), so every run failed with
          # "fatal: could not read Username for 'https://github.com': No such
          # device or address". Route the org's HTTPS clones through the App
          # token instead.
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/stromy-org/".insteadOf "https://github.com/stromy-org/"

          # --skip-answered keeps recorded answers; --trust runs template
          # _tasks; --conflict rej makes a genuine merge conflict
          # deterministic (writes .rej files) instead of copier's default
          # `inline` mode, which leaves conflict markers in place that the
          # detection below has no reliable way to see.
          set +e
          uvx copier update --trust --skip-answered --defaults --conflict rej
          COPIER_EXIT=$?
          set -e

          # Detect merge rejects (copier writes *.rej on conflict in --conflict rej mode).
          if find . -name '*.rej' -not -path './.git/*' | grep -q .; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            HAS_REJECTS=true
          else
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            HAS_REJECTS=false
          fi

          # A non-zero exit with NO .rej files is a genuine failure (auth,
          # template error, crash) — fail the job instead of swallowing it.
          # A non-zero exit WITH .rej files is copier's expected "conflicts
          # found" outcome, which routes to the tracking-issue step below.
          if [ "$COPIER_EXIT" -ne 0 ] && [ "$HAS_REJECTS" = "false" ]; then
            echo "::error::copier update exited $COPIER_EXIT with no .rej conflict files present — treating this as a genuine failure, not a mergeable conflict."
            exit "$COPIER_EXIT"
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          # Flag whether the diff touches auto-redeploy paths (merge == redeploy).
          if git status --porcelain | grep -qE '(pyproject\.toml|uv\.lock|Dockerfile|src/|skills/)'; then
            echo "redeploys=true" >> "$GITHUB_OUTPUT"
          else
            echo "redeploys=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open update PR (never auto-merge)
        if: steps.update.outputs.changed == 'true' && steps.update.outputs.conflict == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: chore/copier-update
          delete-branch: true
          commit-message: "chore: ⬆️ Adopt fastmcp-template updates (copier update)"
          title: "chore: ⬆️ Adopt fastmcp-template updates"
          labels: scheduled-routine
          body: |
            Automated `copier update` from the `fastmcp-template` HEAD (Tier-1,
            ORG-PLAN-086). Reviews the **chrome-only** diff and merge — this PR is
            **never** auto-merged.

            **Deploy on merge:** ${{ steps.update.outputs.redeploys == 'true' && 'YES — the diff touches an auto-redeploy path (pyproject.toml / uv.lock / Dockerfile / src/ / skills/); merging will trigger deploy-aca.' || 'no — workflow/scripts/docs-only chrome; no redeploy.' }}

            If your domain code, deps, or version changed here, STOP — the
            three-zone model means updates must only touch chrome. Report it.

      - name: File conflict tracking issue
        if: steps.update.outputs.conflict == 'true'
        env:
          # In-repo issue/label writes use the workflow's own token — the
          # permissions block grants it; the stromy-ci App deliberately lacks
          # Issues permission (verified 2026-08-07: createIssue 403'd).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="copier update: merge conflicts need manual reconciliation"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="\`copier update\` produced \`.rej\` merge rejects that need a human. Run \`uvx copier update --trust\` locally, resolve the \`.rej\` files (chrome wins; keep your individuality files), and open the PR by hand. Tier-2 \`copier recopy\` re-baseline may be warranted if this repo is far behind (see infra-docs/ai/mcp-fleet-maintenance.md)."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Re-detected on $(date -u +%Y-%m-%d). $BODY"
          else
            gh issue create --title "$TITLE" --label scheduled-routine --body "$BODY"
          fi
