name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    # Deploy only when a DEPLOYABLE input changes. A docs / skill-README /
    # instruction push that builds no new artifact must not trigger a full
    # build+deploy (which then fails on transient infra and re-alarms).
    # `skills/**` IS included — MCP-hosted skills are served live by the running
    # container, so a skill-body edit IS deployable. Manual redeploys: dispatch.
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "skills/**"
      # `components/**` is DEPLOYABLE, not config-adjacent: the Dockerfile does
      # `COPY components/ ./components/`, so the entitlement registry and the
      # generated contracts are baked into the image and read from PROJECT_ROOT
      # at runtime. Omitting it meant a change to the BILLING AND AUTHORIZATION
      # table could merge with green CI and never reach production — the failure
      # is silent in the worst direction, since the registry still reads exactly
      # as it did before and nothing reports a gap (found 2026-08-26: the
      # ORG-PLAN-206 self-client flip merged and deployed nothing).
      - "components/**"
      - ".github/workflows/deploy-aca.yml"
  workflow_dispatch:

concurrency:
  group: aca-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Pre-flight — OIDC provisioned?
        id: preflight
        # A freshly-scaffolded MCP fires this deploy on its FIRST push, before
        # Terraform has created the AZURE_* repo vars. azure/login then dies with
        # "Not all values are present". Make that first run a green no-op with a
        # clear message instead: provision with Terraform, then deploy (or
        # trigger workflow_dispatch). Every step below is gated on this.
        run: |
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            echo "oidc_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "oidc_ready=false" >> "$GITHUB_OUTPUT"
            echo "OIDC not provisioned yet (vars.AZURE_CLIENT_ID is empty) — run Terraform first, then re-run this deploy. Skipping."
          fi
          # Are the org App secrets visible to this repo? Decided HERE rather
          # than with `continue-on-error` on the mint step, because a step that
          # is red on EVERY run is indistinguishable from one that has just
          # started failing — which is how a real token failure would hide.
          if [ -n "${{ secrets.CI_APP_ID }}" ]; then
            echo "app_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI_APP_ID is not set — skipping the internal-libs App token. Every dependency of this repo is public today (stromy-byok included), so the build is unaffected. If a PRIVATE internal dependency is ever added, provision CI_APP_ID/CI_APP_PRIVATE_KEY or the build will fail on an unauthenticated clone."
          fi

      - name: Checkout
        if: steps.preflight.outputs.oidc_ready == 'true'
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: steps.preflight.outputs.oidc_ready == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.preflight.outputs.oidc_ready == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        if: steps.preflight.outputs.oidc_ready == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Mint stromy-ci App token (clone private internal libs)
