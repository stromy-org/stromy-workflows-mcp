name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    # Deploy only when a DEPLOYABLE input changes. A docs / skill-README /
    # instruction push that builds no new artifact must not trigger a full
    # build+deploy (which then fails on transient infra and re-alarms).
    # `skills/**` IS included — MCP-hosted skills are served live by the running
    # container, so a skill-body edit IS deployable. Manual redeploys: dispatch.
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "skills/**"
      # `components/**` is DEPLOYABLE, not config-adjacent: the Dockerfile does
      # `COPY components/ ./components/`, so the entitlement registry and the
      # generated contracts are baked into the image and read from PROJECT_ROOT
      # at runtime. Omitting it meant a change to the BILLING AND AUTHORIZATION
      # table could merge with green CI and never reach production — the failure
      # is silent in the worst direction, since the registry still reads exactly
      # as it did before and nothing reports a gap (found 2026-08-26: the
      # ORG-PLAN-206 self-client flip merged and deployed nothing).
      - "components/**"
      - ".github/workflows/deploy-aca.yml"
  workflow_dispatch:

concurrency:
  group: aca-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Pre-flight — OIDC provisioned?
        id: preflight
        # A freshly-scaffolded MCP fires this deploy on its FIRST push, before
        # Terraform has created the AZURE_* repo vars. azure/login then dies with
        # "Not all values are present". Make that first run a green no-op with a
        # clear message instead: provision with Terraform, then deploy (or
        # trigger workflow_dispatch). Every step below is gated on this.
        run: |
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            echo "oidc_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "oidc_ready=false" >> "$GITHUB_OUTPUT"
            echo "OIDC not provisioned yet (vars.AZURE_CLIENT_ID is empty) — run Terraform first, then re-run this deploy. Skipping."
          fi
          # Are the org App secrets visible to this repo? Decided HERE rather
          # than with `continue-on-error` on the mint step, because a step that
          # is red on EVERY run is indistinguishable from one that has just
          # started failing — which is how a real token failure would hide.
          if [ -n "${{ secrets.CI_APP_ID }}" ]; then
            echo "app_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI_APP_ID is not set — skipping the internal-libs App token. Every dependency of this repo is public today (stromy-byok included), so the build is unaffected. If a PRIVATE internal dependency is ever added, provision CI_APP_ID/CI_APP_PRIVATE_KEY or the build will fail on an unauthenticated clone."
          fi

      - name: Checkout
        if: steps.preflight.outputs.oidc_ready == 'true'
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: steps.preflight.outputs.oidc_ready == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.preflight.outputs.oidc_ready == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        if: steps.preflight.outputs.oidc_ready == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Mint stromy-ci App token (clone private internal libs)
        # SKIPPED, not failed-and-tolerated (ORG-232). On a PUBLIC satellite the
        # org App secrets are not visible, so this mint used to fail on every
        # single deploy under `continue-on-error` — a permanent red annotation
        # that trained everyone to ignore the one signal that would matter when
        # the token genuinely broke. The pre-flight now decides up front whether
        # credentials exist; when they do and the mint still fails, the deploy
        # fails with it rather than degrading silently to an unauthenticated
        # clone. The Dockerfile's `if -s /run/secrets/internal_libs_pat` guard
        # keeps the all-public dependency set building with an empty secret.
        if: >-
          steps.preflight.outputs.oidc_ready == 'true' &&
          steps.preflight.outputs.app_creds == 'true'
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Build and push image
        if: steps.preflight.outputs.oidc_ready == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            internal_libs_pat=${{ steps.app-token.outputs.token }}

      - name: Azure login (OIDC)
        if: steps.preflight.outputs.oidc_ready == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        if: steps.preflight.outputs.oidc_ready == 'true'
        uses: azure/cli@v3
        with:
          inlineScript: |
            az containerapp update \
              --name stromy-workflows-mcp \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --image ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Verify deploy — the NEW revision is serving
        if: steps.preflight.outputs.oidc_ready == 'true'
        # NOT a plain `curl https://$FQDN/health` loop. `az containerapp update`
        # returns once the revision is ACCEPTED, and the app FQDN keeps serving
        # the OUTGOING revision until rollover completes — so such a loop passed
        # within seconds against the code being replaced (ORG-190, 2026-08-01).
        #
        # This repository is public while stromy-org is private, and GitHub does
        # not allow a public caller to load an action from a private repository
        # (the run dies at 0s with no jobs and no logs), so the shared
        # implementation is VENDORED here rather than referenced. The copy is
        # byte-identical to
        # stromy-org/.github/actions/verify-aca-deploy/verify.sh and
        # `scripts/audit-aca-verify-drift.py` in that repo enforces it.
        # Do not edit the vendored script directly — edit the canonical one.
        env:
          APP: stromy-workflows-mcp
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: bash .github/scripts/verify-aca-deploy.sh
