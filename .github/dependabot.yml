# Volume is the thing to control here. Ungrouped, Dependabot opens one PR per
# dependency per week; across the org that reached 89 open PRs on 2026-07-27, well
# past the point where anyone reads them — and an MCP's dependency surface (fastmcp,
# starlette, pydantic, authlib, cryptography …) churns fast.
#
# Grouping is by UPDATE TYPE rather than dependency-type, because `dependency-type`
# in a group is only supported by bundler/composer/mix/maven/npm/pip — NOT by `uv`,
# where it is silently ignored. The split below works in every ecosystem and lines up
# with what the dependabot-auto-merge workflow can land unattended:
#
#   patch  → one PR per ecosystem per week, auto-merged once CI is green
#   minor  → one PR per ecosystem per week, one human review
#   major  → an individual PR each, always reviewed
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patch:
        update-types: ["patch"]
      minor:
        update-types: ["minor"]

  # Action bumps are pure CI plumbing and arrive constantly; one grouped PR a week.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
